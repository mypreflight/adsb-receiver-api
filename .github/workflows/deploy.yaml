name: 'deploy'

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: 'Login to ghcr.io'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: '${{github.actor}}'
          password: '${{secrets.GITHUB_TOKEN}}'
      - name: 'Clone repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Build app docker image'
        run: |
          AUTHOR=$(jq -r ".author" package.json)
          NAME=$(jq -r ".name" package.json)
          VERSION=$(jq -r ".version" package.json)

          IMAGE="ghcr.io/${AUTHOR}/${NAME}"
          docker build --target production -t "${IMAGE}:${VERSION}" .

          # tag same image as :latest
          docker tag "${IMAGE}:${VERSION}" "${IMAGE}:latest"
      - name: 'Push docker image to ghcr.io'
        run: |
          AUTHOR=$(jq -r ".author" package.json)
          NAME=$(jq -r ".name" package.json)
          VERSION=$(jq -r ".version" package.json)

          IMAGE="ghcr.io/${AUTHOR}/${NAME}"
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"
  infra:
    needs: 'build'
    if: github.ref == 'refs/heads/main' && !failure() && !cancelled()
    runs-on: 'ubuntu-latest'
    environment: 'production'
    timeout-minutes: 30
    concurrency:
      group: 'infra-production'
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_admin_token: ${{ secrets.ADMIN_TOKEN }}
      TF_VAR_client_token: ${{ secrets.CLIENT_TOKEN }}
      TF_VAR_cloudflare_tunnel_token: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Configure AWS credentials'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: 'Set up OpenTofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: 'infra/.opentofu-version'
          tofu_wrapper: false
      - name: 'Initialize OpenTofu'
        run: 'tofu -chdir=infra init -input=false'
      - name: 'Plan infrastructure changes'
        run: 'tofu -chdir=infra plan -input=false -lock-timeout=10m -out=tfplan'
      - name: 'Report the plan'
        continue-on-error: true
        uses: gi-org-pl/report-tofu-plan-action@3e9723344bbd1c09659e14bf34be192d8db84213 # v1.0.1
        with:
          working-directory: 'infra'
      - name: 'Apply infrastructure changes'
        run: 'tofu -chdir=infra apply -input=false -lock-timeout=10m tfplan'
